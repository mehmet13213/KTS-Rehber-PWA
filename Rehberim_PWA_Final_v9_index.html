<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#172554">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rehberim">
<link rel="manifest" href="manifest.json">
<title>Rehberim</title>
<style>
:root{--nav:#172554;--bg:#eef2f7;--text:#172033;--muted:#64748b;--card:#fff;--border:#dbe3ee}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea{font:inherit} button{cursor:pointer}
.app{height:100dvh;display:flex;flex-direction:column}
header{background:var(--nav);color:#fff;padding:calc(9px + env(safe-area-inset-top)) 12px 10px;box-shadow:0 3px 12px #0004;z-index:10}
.brand{display:flex;align-items:center;gap:9px}.logo{width:38px;height:38px;border-radius:11px;background:#fff2;display:grid;place-items:center;font-size:20px}
.brand b{font-size:20px}.brand small{display:block;color:#cbd5e1;font-size:10px}.headBtns{margin-left:auto;display:flex;gap:6px}
.headBtns button{border:0;background:#ffffff16;color:#fff;border-radius:10px;padding:7px 8px;font-size:10px;font-weight:700}
.search{margin-top:9px;width:100%;border:0;outline:0;background:#fff;color:#111827;border-radius:13px;padding:11px 13px}
.main{flex:1;min-height:0;background:var(--page-bg);transition:background-color .28s ease}.main.status-bg-none{--page-bg:#eef2f7}.main.status-bg-acildi{--page-bg:#eef2f7}.main.status-bg-mesgul{--page-bg:#eef2f7}.main.status-bg-cevap{--page-bg:#eef2f7}.main.status-bg-kapali{--page-bg:#eef2f7}.main.status-bg-kullanim{--page-bg:#eef2f7}.main.status-bg-evrak{--page-bg:#eef2f7}.slider{height:100%;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.slider::-webkit-scrollbar{display:none}.card{min-width:100%;height:100%;scroll-snap-align:start;padding:12px;overflow-y:auto}
.cardbox{max-width:680px;margin:0 auto;background:#fff;border-radius:22px;padding:15px;box-shadow:0 8px 28px #17255414;border:1px solid #e7edf5;transition:background-color .25s ease;position:relative;padding-left:40px}
.cardbox.status-acildi{background:#ecfdf3;border-left:6px solid #16a34a}.cardbox.status-mesgul{background:#fff9df;border-left:6px solid #ca8a04}.cardbox.status-cevap{background:#fff1e8;border-left:6px solid #ea580c}.cardbox.status-kapali{background:#edf5ff;border-left:6px solid #2563eb}.cardbox.status-kullanim{background:#f1f2f4;border-left:6px solid #4b5563}.cardbox.status-evrak{background:#f3efff;border-left:6px solid #7c3aed}
.status-ribbon{position:absolute;left:8px;top:50%;transform:translateY(-50%) rotate(-90deg);transform-origin:center center;display:flex;align-items:center;justify-content:center;width:max-content;min-width:92px;height:22px;padding:3px 9px;border-radius:11px;font-size:10px;font-weight:900;letter-spacing:.3px;text-align:center;white-space:nowrap;z-index:5;pointer-events:none}.status-ribbon.acildi{background:#bbf7d0;color:#166534}.status-ribbon.mesgul{background:#fde68a;color:#854d0e}.status-ribbon.cevap{background:#fed7aa;color:#9a3412}.status-ribbon.kapali{background:#bfdbfe;color:#1e40af}.status-ribbon.kullanim{background:#d1d5db;color:#374151}.status-ribbon.evrak{background:#ddd6fe;color:#5b21b6}.profile{display:flex;align-items:center;gap:11px}.avatar{width:52px;height:52px;border-radius:50%;background:#e2e8f0;display:grid;place-items:center;font-size:17px;font-weight:800;color:#475569}
.name{font-size:25px;font-weight:850;line-height:1.08}.sys{display:inline-block;margin-top:5px;background:#eff6ff;color:#1d4ed8;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800}
.pos{margin-left:auto;background:#ecfdf5;color:#166534;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:800}
.phone{margin-top:13px;background:#eff6ff;border:1px solid #dbeafe;border-radius:14px;padding:12px;text-decoration:none;color:#1d4ed8;display:flex;align-items:center;gap:9px}.phone .num{font-size:19px;font-weight:850}.phone .go{margin-left:auto;font-size:22px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}.info{border-radius:13px;padding:11px;min-height:78px;border:1px solid var(--border)}.purple{background:#f5f3ff}.yellow{background:#fffbeb}.blue{background:#eff6ff}.green{background:#f0fdf4}
.label{font-size:10px;color:#64748b;font-weight:850;text-transform:uppercase}.value{font-size:14px;font-weight:750;margin-top:5px;line-height:1.25}.big{font-size:19px}
.statusPanel{margin-top:13px;border-radius:15px;padding:11px;transition:background-color .25s ease;border:1px solid #e2e8f0}.statusPanel.none{background:#f8fafc}.statusPanel.acildi{background:#dcfce7}.statusPanel.mesgul{background:#fef3c7}.statusPanel.cevap{background:#ffedd5}.statusPanel.kapali{background:#dbeafe}.statusPanel.kullanim{background:#e5e7eb}.statusPanel.evrak{background:#ede9fe}.statusTitle{margin-top:0;font-size:12px;font-weight:850;color:#475569}.statuses{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:7px}
.status{border:1px solid transparent;border-radius:11px;padding:10px 5px;min-height:52px;font-size:11px;font-weight:850;line-height:1.1}.status.active{box-shadow:0 0 0 2px #172554 inset}
.s1{background:#dcfce7}.s2{background:#fef3c7}.s3{background:#ffedd5}.s4{background:#dbeafe}.s5{background:#e5e7eb}.s6{background:#ede9fe}
.note{margin-top:10px;width:100%;min-height:60px;resize:none;border:1px solid var(--border);border-radius:12px;padding:10px;outline:0}
footer{background:var(--nav);color:#fff;padding:7px 10px calc(7px + env(safe-area-inset-bottom));z-index:10}.nav{display:flex;align-items:center;gap:8px}.nav button{flex:1;border:0;border-radius:11px;padding:9px;background:#ffffff16;color:#fff;font-weight:800}.count{text-align:center;min-width:72px;font-weight:850;font-size:12px}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:50}.modal.show{display:flex}.sheet{width:100%;max-height:88dvh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:18px}.sheet h2{margin:0 0 12px}.sheet button{width:100%;border:0;border-radius:12px;padding:12px;margin-top:8px;background:#eef2f7;text-align:left;font-weight:750}.sheet .danger{background:#fee2e2;color:#991b1b}.sheet .primary{background:#172554;color:#fff;text-align:center}
.field label{display:block;font-size:11px;font-weight:800;color:#64748b;margin-bottom:5px}.field input{width:100%;padding:11px;border:1px solid var(--border);border-radius:11px;outline:0}
.statGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{border:0;border-radius:14px;padding:13px;text-align:left;background:#f1f5f9}.stat b{display:block;font-size:22px}.stat span{font-size:11px;font-weight:750;color:#475569}
.lock{position:fixed;inset:0;background:linear-gradient(160deg,#172554,#0f172a);z-index:100;color:#fff;display:flex;align-items:center;justify-content:center;padding:25px}.lockbox{width:min(380px,100%);text-align:center}.biglogo{font-size:58px}.lockbox h1{margin:5px 0}.lockbox p{color:#cbd5e1;font-size:13px}.pin{width:100%;padding:14px;border:0;border-radius:13px;text-align:center;font-size:21px;letter-spacing:5px;outline:0}.unlock{width:100%;margin-top:9px;border:0;border-radius:13px;padding:13px;background:#fff;color:#172554;font-weight:900}.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 14px;border-radius:999px;font-size:12px;display:none;z-index:80}.toast.show{display:block}
.empty{height:100%;display:grid;place-items:center;text-align:center;color:#64748b;padding:30px}
@media(max-width:420px){.name{font-size:22px}.status{font-size:10px}.cardbox{padding:13px}}
</style>
</head>
<body>
<div id="lock" class="lock"><div class="lockbox"><div class="biglogo">📱</div><h1>REHBERİM</h1><p id="lockText">Uygulamaya erişmek için şifrenizi girin.</p><input id="pin" class="pin" type="password" inputmode="numeric" maxlength="12" placeholder="••••••"><button id="unlock" class="unlock">GİRİŞ</button></div></div>
<div class="app">
<header><div class="brand"><div class="logo">👥</div><div><b>REHBERİM</b><small>Arama ve Takip Uygulaması</small></div><div class="headBtns"><button onclick="openImport()">📥<br>Liste</button><button onclick="openStats()">📊<br>İstatistik</button><button onclick="openSettings()">⚙️<br>Ayarlar</button></div></div><input id="search" class="search" placeholder="İsim, telefon veya sistem no ile ara..." autocomplete="off"></header>
<main class="main"><div id="slider" class="slider"></div></main>
<footer><div class="nav"><button onclick="prev()">◀ Önceki</button><div id="counter" class="count">0 / 0</div><button onclick="next()">Sonraki ▶</button></div></footer></div>
<div id="modal" class="modal"><div id="sheet" class="sheet"></div></div>
<input id="file" type="file" accept=".json,application/json" hidden><div id="toast" class="toast"></div>

<script>
const DBKEY="rehberim_secure_v1", METAKEY="rehberim_meta_v1";
let people=[],filtered=[],current=0,sessionKey=null,lastActivity=Date.now(),lockMinutes=5;
const STATUS=[["acildi","Telefonu açtı","s1"],["mesgul","Meşgul","s2"],["cevap","Cevap vermiyor","s3"],["kapali","Telefon kapalı","s4"],["kullanim","Telefon kullanılmıyor","s5"],["evrak","Evrak ekibe verildi","s6"]];
const SAMPLE=[
{sistemNo:"385653",adSoyad:"Ahmet Yılmaz",telefon:"0555 111 22 33",bendler:"Tedbir kararı, uzaklaştırma kararı mevcut.",kararSuresi:"6 Ay",kararBitisTarihi:"15.12.2026"},
{sistemNo:"385654",adSoyad:"Mehmet Kaya",telefon:"0532 222 33 44",bendler:"Tedbir kararı mevcut.",kararSuresi:"3 Ay",kararBitisTarihi:"20.11.2026"},
{sistemNo:"385655",adSoyad:"Ayşe Demir",telefon:"0544 333 44 55",bendler:"Tedbir kararı.",kararSuresi:"6 Ay",kararBitisTarihi:"05.01.2027"}];
function b64(buf){let s="";for(const x of new Uint8Array(buf))s+=String.fromCharCode(x);return btoa(s)}
function ub64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function derive(pin,salt){const b=await crypto.subtle.importKey("raw",new TextEncoder().encode(pin),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt:ub64(salt),iterations:150000,hash:"SHA-256"},b,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function enc(o,k){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},k,new TextEncoder().encode(JSON.stringify(o)));return{iv:b64(iv),ct:b64(ct)}}
async function dec(p,k){const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub64(p.iv)},k,ub64(p.ct));return JSON.parse(new TextDecoder().decode(pt))}
async function hash(p){return b64(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(p)))}
function meta(){try{return JSON.parse(localStorage.getItem(METAKEY)||"null")}catch{return null}}
function toast(s){const t=document.getElementById("toast");t.textContent=s;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)}
function touch(){lastActivity=Date.now()}["click","touchstart","keydown","input"].forEach(e=>document.addEventListener(e,touch,{passive:true}));
async function savePeople(){if(sessionKey)localStorage.setItem(DBKEY,JSON.stringify(await enc(people,sessionKey)))}
async function unlock(){
 const pin=document.getElementById("pin").value;if(pin.length<4){toast("En az 4 haneli şifre girin.");return}
 const m=meta();
 try{
  if(!m){if(pin!=="385653"){toast("İlk giriş şifresi: 385653");return}const salt=b64(crypto.getRandomValues(new Uint8Array(16)));sessionKey=await derive(pin,salt);localStorage.setItem(METAKEY,JSON.stringify({salt,hash:await hash(pin),lockMinutes:5}));lockMinutes=5;people=SAMPLE.map(x=>({...x}));await savePeople();filtered=[...people];document.getElementById("lock").style.display="none";render();toast("Giriş başarılı.");}
  else{if(await hash(pin)!==m.hash){toast("Şifre hatalı.");return}sessionKey=await derive(pin,m.salt);lockMinutes=m.lockMinutes||5;const p=localStorage.getItem(DBKEY);people=p?await dec(JSON.parse(p),sessionKey):[];filtered=[...people];document.getElementById("lock").style.display="none";render()}
  document.getElementById("pin").value="";
 }catch(e){toast("Veriler açılamadı.")}
}
function lockNow(){sessionKey=null;people=[];filtered=[];current=0;document.getElementById("lock").style.display="flex";document.getElementById("lockText").textContent="Otomatik kilitlendi. Devam etmek için şifrenizi girin.";document.getElementById("pin").value=""}
setInterval(()=>{if(sessionKey&&lockMinutes>0&&Date.now()-lastActivity>lockMinutes*60000)lockNow()},1000);
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function phoneHref(v){return"tel:"+String(v??"").replace(/[^\d+]/g,"")}
function daysLeft(s){if(!s)return null;const a=String(s).split(/[.\-\/]/).map(Number);if(a.length!==3||a.some(isNaN))return null;const d=new Date(a[2],a[1]-1,a[0]);d.setHours(0,0,0,0);const n=new Date();n.setHours(0,0,0,0);return Math.ceil((d-n)/86400000)}
function initials(n){return String(n||"?").split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase()}
function render(){
 const sld=document.getElementById("slider"),main=document.querySelector(".main");sld.innerHTML="";main.className="main";
 if(!filtered.length){main.classList.add("status-bg-none");sld.innerHTML='<div class="empty"><div><div style="font-size:46px">📋</div><h2>Liste boş</h2><p>Liste menüsünden haftalık JSON dosyasını yükleyin.</p></div></div>';updateCounter();return}
 filtered.forEach((p,i)=>{
  const d=daysLeft(p.kararBitisTarihi),st=STATUS.find(x=>x[0]===p.durum),sec=document.createElement("section");sec.className="card";
  sec.innerHTML=`<div class="cardbox status-${p.durum||""}">${p.durum?`<div class="status-ribbon ${p.durum}">${esc((STATUS.find(x=>x[0]===p.durum)||["","Durum"])[1])}</div>`:""}<div class="profile"><div class="avatar">${esc(initials(p.adSoyad))}</div><div><div class="name">${esc(p.adSoyad)}</div><div class="sys">Sistem No: ${esc(p.sistemNo)}</div></div><div class="pos">${i+1} / ${filtered.length}</div></div>
  <a class="phone" href="${phoneHref(p.telefon)}"><span>📞</span><span class="num">${esc(p.telefon)}</span><span class="go">›</span></a>
  <div class="grid2"><div class="info purple"><div class="label">Bendler / Karar</div><div class="value">${esc(p.bendler||"—")}</div></div><div class="info yellow"><div class="label">Kararın Süresi</div><div class="value big">${esc(p.kararSuresi||"—")}</div></div><div class="info blue"><div class="label">Kararın Bitiş Tarihi</div><div class="value big">${esc(p.kararBitisTarihi||"—")}</div></div><div class="info green"><div class="label">Kalan Süre</div><div class="value big">${d===null?"—":d>=0?d+" gün kaldı":Math.abs(d)+" gün geçti"}</div></div></div>
  <div class="statusPanel ${p.durum||"none"}"><div class="statusTitle">İşlem Durumu${st?" — "+esc(st[1]):""}</div><div class="statuses">${STATUS.map(x=>`<button class="status ${x[2]} ${p.durum===x[0]?"active":""}" data-s="${x[0]}">${esc(x[1])}</button>`).join("")}</div></div>
  <textarea class="note" placeholder="Bu kişi için not...">${esc(p.not||"")}</textarea></div>`;
  sec.querySelectorAll(".status").forEach(b=>b.onclick=async()=>{p.durum=b.dataset.s;await savePeople();render();requestAnimationFrame(()=>goTo(i,false))});
  sec.querySelector(".note").addEventListener("input",async e=>{p.not=e.target.value;await savePeople()});sld.appendChild(sec)
 });updateCounter();setPageStatus();requestAnimationFrame(()=>goTo(Math.min(current,filtered.length-1),false))
}
function updateCounter(){document.getElementById("counter").textContent=filtered.length?`${current+1} / ${filtered.length}`:"0 / 0";setPageStatus()}
function setPageStatus(){const main=document.querySelector(".main");main.className="main";const p=filtered[current];main.classList.add(p?.durum?`status-bg-${p.durum}`:"status-bg-none")}
function goTo(i,s=true){if(!filtered.length)return;current=Math.max(0,Math.min(i,filtered.length-1));const e=document.querySelectorAll(".card")[current];if(e)e.scrollIntoView({behavior:s?"smooth":"auto",inline:"start",block:"nearest"});updateCounter()}
function next(){goTo(current+1)}function prev(){goTo(current-1)}
document.getElementById("slider").addEventListener("scroll",()=>{const w=document.getElementById("slider").clientWidth;if(w){const i=Math.round(document.getElementById("slider").scrollLeft/w);if(i!==current&&i>=0&&i<filtered.length){current=i;updateCounter()}}},{passive:true});
document.getElementById("search").addEventListener("input",e=>{const q=e.target.value.trim().toLocaleLowerCase("tr-TR");filtered=people.filter(p=>[p.adSoyad,p.telefon,p.sistemNo,p.bendler,p.kararSuresi,p.kararBitisTarihi].join(" ").toLocaleLowerCase("tr-TR").includes(q));current=0;render()});
function closeModal(){document.getElementById("modal").classList.remove("show")}
function openImport(){document.getElementById("sheet").innerHTML=`<h2>📥 Haftalık Liste</h2><p>Excel'den oluşturulan JSON dosyasını yükleyin. Liste cihazda şifreli saklanır.</p><button class="primary" onclick="document.getElementById('file').click()">JSON DOSYASI SEÇ</button><button onclick="closeModal()">Vazgeç</button>`;document.getElementById("modal").classList.add("show")}
document.getElementById("file").addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;try{const o=JSON.parse(await f.text()),list=Array.isArray(o)?o:(o.people||o.kisiler||o.veriler);if(!Array.isArray(list))throw Error();people=list.map(p=>({sistemNo:p.sistemNo??p.sistem_no??p.sistem??"",adSoyad:p.adSoyad??p.ad_soyad??p.isim??p.ad??"",telefon:p.telefon??p.phone??"",bendler:p.bendler??"",kararSuresi:p.kararSuresi??p.karar_suresi??p.sure??"",kararBitisTarihi:p.kararBitisTarihi??p.karar_bitis_tarihi??p.tedbirBitisTarihi??p.tedbir_bitis_tarihi??p.bitisTarihi??"",durum:p.durum??"",not:p.not??""}));filtered=[...people];current=0;await savePeople();closeModal();render();toast(`${people.length} kişi yüklendi.`)}catch(err){toast("JSON dosyası okunamadı.")}e.target.value=""});
function openStats(){const c=Object.fromEntries(STATUS.map(x=>[x[0],0]));people.forEach(p=>{if(c[p.durum]!==undefined)c[p.durum]++});const done=Object.values(c).reduce((a,b)=>a+b,0);document.getElementById("sheet").innerHTML=`<h2>📊 İstatistikler</h2><p>Toplam: <b>${people.length}</b> · İşlem yapılan: <b>${done}</b> · Kalan: <b>${Math.max(0,people.length-done)}</b></p><div class="statGrid">${STATUS.map(x=>`<button class="stat" onclick="filterStatus('${x[0]}')"><b>${c[x[0]]}</b><span>${x[1]}</span></button>`).join("")}</div><button onclick="showAll()">Tüm kişileri göster</button><button onclick="closeModal()">Kapat</button>`;document.getElementById("modal").classList.add("show")}
function filterStatus(s){filtered=people.filter(p=>p.durum===s);current=0;closeModal();render();toast(`${filtered.length} kişi listelendi.`)}function showAll(){filtered=[...people];current=0;closeModal();render()}
function openSettings(){const m=meta();document.getElementById("sheet").innerHTML=`<h2>⚙️ Ayarlar</h2><div class="field"><label>Otomatik kilit süresi (dakika)</label><input id="lockField" type="number" min="1" max="120" value="${m?.lockMinutes||5}"></div><button class="primary" onclick="saveLock()">Otomatik kilidi kaydet</button><button onclick="changePin()">🔑 Şifreyi değiştir</button><button class="danger" onclick="clearData()">🗑️ Haftalık veriyi sil</button><button onclick="closeModal()">Kapat</button>`;document.getElementById("modal").classList.add("show")}
function saveLock(){const n=Math.max(1,Math.min(120,Number(document.getElementById("lockField").value)||5)),m=meta();m.lockMinutes=n;localStorage.setItem(METAKEY,JSON.stringify(m));lockMinutes=n;closeModal();toast("Otomatik kilit güncellendi.")}
async function changePin(){const old=prompt("Mevcut şifre:");if(old===null)return;const m=meta();if(await hash(old)!==m.hash){alert("Mevcut şifre hatalı.");return}const np=prompt("Yeni şifre (en az 4 hane):");if(!np||np.length<4){alert("Geçersiz şifre.");return}const data=people.slice(),salt=b64(crypto.getRandomValues(new Uint8Array(16))),nk=await derive(np,salt);localStorage.setItem(METAKEY,JSON.stringify({salt,hash:await hash(np),lockMinutes:m.lockMinutes}));sessionKey=nk;await savePeople();closeModal();toast("Şifre değiştirildi.")}
function clearData(){if(!confirm("Bu telefondaki haftalık liste, notlar ve işlem durumları silinsin mi?"))return;localStorage.removeItem(DBKEY);people=[];filtered=[];current=0;closeModal();render();toast("Haftalık veri silindi.")}
document.getElementById("unlock").onclick=unlock;document.getElementById("pin").addEventListener("keydown",e=>{if(e.key==="Enter")unlock()});
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
