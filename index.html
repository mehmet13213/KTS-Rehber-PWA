<style>
:root{
  --nav:#0f2a63;
  --nav2:#183b82;
  --bg:#eaf1f8;
  --text:#10213f;
  --muted:#60708b;
  --border:rgba(255,255,255,.55);

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
body{background:radial-gradient(circle at 15% 12%,rgba(255,255,255,.92) 0,transparent 30%),radial-gradient(circle at 86% 28%,rgba(210,225,242,.75) 0,transparent 34%),radial-gradient(circle at 55% 90%,rgba(255,245,230,.48) 0,transparent 28%),linear-gradient(145deg,#e7eef5,#cfdbe7)}
button,input,textarea{font:inherit}button{cursor:pointer}
.app{height:100dvh;display:flex;flex-direction:column}
header{position:relative;background:rgba(240,246,252,.34);color:#10213f;padding:calc(10px + env(safe-area-inset-top)) 14px 12px;box-shadow:0 10px 30px rgba(48,69,92,.10);z-index:10;backdrop-filter:blur(28px) saturate(145%);-webkit-backdrop-filter:blur(28px) saturate(145%);border-bottom:1px solid rgba(255,255,255,.55)}
.brand{display:flex;align-items:center;gap:10px}.logo{width:50px;height:50px;border-radius:16px;background:rgba(255,255,255,.48);border:1px solid rgba(255,255,255,.78);display:grid;place-items:center;font-size:24px;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 9px 22px rgba(44,69,100,.12);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.brand b{font-size:22px;letter-spacing:-.4px;color:#10213f}.brand small{display:block;color:#52657e;font-size:11px;margin-top:1px}.headBtns{margin-left:auto;display:flex;gap:7px}
.headBtns button{border:1px solid rgba(255,255,255,.62);background:rgba(255,255,255,.30);color:#10213f;border-radius:14px;padding:8px 9px;font-size:10px;font-weight:800;min-width:61px;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 7px 18px rgba(0,0,0,.08);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.searchBtn{font-size:22px!important;line-height:1;padding:6px 9px!important;min-width:44px!important}.searchWrap{position:absolute;left:10px;right:10px;top:100%;z-index:30;display:none;padding-top:8px}.searchWrap.open{display:block}.searchWrap .search{position:relative;left:auto;right:auto;top:auto;transform:none!important;opacity:1!important;visibility:visible!important;width:100%;margin:0;padding-right:44px}.searchClose{position:absolute;right:7px;top:15px;width:34px;height:34px;border:0;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:23px;line-height:1}.search{position:absolute;left:14px;right:14px;top:100%;margin:0;width:auto;z-index:20;transform:translateY(-115%);opacity:0;visibility:hidden;transition:transform .24s ease,opacity .2s ease,visibility .2s ease;border:1px solid rgba(255,255,255,.34);outline:0;background:rgba(255,255,255,.48);color:#10213f;border-radius:17px;padding:13px 15px;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 8px 22px rgba(0,0,0,.08);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.search::placeholder{color:rgba(54,72,96,.70)}

.main{flex:1;min-height:0;background:transparent;transition:background-color .28s ease}.main.status-bg-none,.main.status-bg-acildi,.main.status-bg-mesgul,.main.status-bg-cevap,.main.status-bg-kapali,.main.status-bg-kullanim,.main.status-bg-evrak{--page-bg:transparent}
.slider{height:100%;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;padding:12px 0 10px}.slider::-webkit-scrollbar{display:none}
.card{min-width:100%;height:100%;scroll-snap-align:start;padding:0 12px;overflow:hidden}.cardbox{display:flex;flex-direction:column;position:relative;isolation:isolate;max-width:680px;height:100%;margin:0 auto;background:var(--glass);border-radius:28px;padding:17px;box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.78);transition:background-color .25s ease,border-color .25s ease,box-shadow .25s ease;position:relative;overflow:hidden;backdrop-filter:blur(24px) saturate(135%);-webkit-backdrop-filter:blur(24px) saturate(135%)}
.cardbox::after{content:attr(data-watermark);position:absolute;left:50%;top:48%;transform:translate(-50%,-50%) rotate(-28deg);font-size:clamp(42px,12vw,82px);font-weight:900;letter-spacing:3px;white-space:nowrap;pointer-events:none;z-index:999;opacity:.10;color:#173b76;text-transform:uppercase;line-height:1}
.cardbox.status-acildi::after{color:#15803d}.cardbox.status-mesgul::after{color:#a16207}.cardbox.status-cevap::after{color:#c2410c}.cardbox.status-kapali::after{color:#1d4ed8}.cardbox.status-kullanim::after{color:#475569}.cardbox.status-evrak::after{color:#6d28d9}
.cardbox>*{position:relative;z-index:1}
.cardbox.status-acildi{background:rgba(248,250,252,.58);border-left:2px solid #22c55e}.cardbox.status-mesgul{background:rgba(248,250,252,.58);border-left:2px solid #eab308}.cardbox.status-cevap{background:rgba(248,250,252,.58);border-left:2px solid #f97316}.cardbox.status-kapali{background:rgba(248,250,252,.58);border-left:2px solid #3b82f6}.cardbox.status-kullanim{background:rgba(248,250,252,.58);border-left:2px solid #6b7280}.cardbox.status-evrak{background:rgba(248,250,252,.58);border-left:2px solid #8b5cf6}
.profile{display:flex;align-items:center;gap:12px}.profile>div:nth-child(2){min-width:0;flex:1}.avatar{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.48);border:1px solid rgba(255,255,255,.78);display:grid;place-items:center;font-size:18px;font-weight:800;color:#40506b;box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 8px 22px rgba(44,69,100,.09);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.name{font-size:25px;font-weight:850;line-height:1.08;letter-spacing:-.45px;white-space:pre-line;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}.sys{display:inline-block;margin-top:6px;background:rgba(239,246,255,.78);color:#1d4ed8;border:1px solid rgba(255,255,255,.7);border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800}.pos{margin-left:auto;background:rgba(255,255,255,.48);border:1px solid rgba(255,255,255,.65);color:#17427d;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:850;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;flex:1;align-content:stretch}.info{border-radius:17px;padding:13px;min-height:86px;height:100%;box-sizing:border-box;border:1px solid rgba(255,255,255,.72);box-shadow:inset 0 1px 0 rgba(255,255,255,.72),0 7px 18px rgba(39,64,95,.05);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}.purple,.yellow,.blue,.green{background:rgba(255,255,255,.42)}
.label{font-size:10px;color:#5d6f8d;font-weight:850;text-transform:uppercase;letter-spacing:.35px}.value{font-size:14px;font-weight:750;margin-top:6px;line-height:1.25}.big{font-size:20px;letter-spacing:-.2px}
.statusPanel{margin-top:10px;border-radius:18px;padding:12px;border:1px solid rgba(255,255,255,.72);box-shadow:inset 0 1px 0 rgba(255,255,255,.72),0 8px 20px rgba(39,64,95,.05);transition:background-color .25s ease;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.statusPanel.none,.statusPanel.acildi,.statusPanel.mesgul,.statusPanel.cevap,.statusPanel.kapali,.statusPanel.kullanim,.statusPanel.evrak{background:rgba(255,255,255,.38)}.statusTitle{margin-top:0;font-size:12px;font-weight:850;color:#42546f}.statuses{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:7px}.status{border:1px solid rgba(255,255,255,.58);border-radius:15px;padding:12px 6px;min-height:58px;font-size:11px;font-weight:850;line-height:1.1;box-shadow:inset 0 1px 0 rgba(255,255,255,.5);transition:transform .12s ease,box-shadow .15s ease;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}.status:active{transform:scale(.97)}.status.active{box-shadow:0 0 0 2px #173b76 inset,0 5px 14px rgba(20,55,100,.12)}
.s1,.s2,.s3,.s4,.s5,.s6{background:rgba(255,255,255,.36);color:#10213f}
.note{margin-top:8px;width:100%;height:34px;min-height:34px;max-height:34px;box-sizing:border-box;resize:none;resize:none;border:1px solid rgba(255,255,255,.72);border-radius:16px;padding:12px;outline:0;background:rgba(255,255,255,.48);color:var(--text);box-shadow:inset 0 1px 0 rgba(255,255,255,.7);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}.note::placeholder{color:#8190a8}
footer{background:rgba(236,243,249,.34);color:#10213f;padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:10;border-top:1px solid rgba(255,255,255,.1);box-shadow:0 -8px 25px rgba(15,42,99,.18);backdrop-filter:blur(24px) saturate(145%);-webkit-backdrop-filter:blur(24px) saturate(145%)}.nav{display:flex;align-items:center;gap:9px}.nav button{flex:1;border:1px solid rgba(255,255,255,.68);border-radius:18px;padding:11px;background:rgba(255,255,255,.34);color:#10213f;font-weight:800;box-shadow:inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}.count{text-align:center;min-width:72px;font-weight:850;font-size:13px}
.modal{position:fixed;inset:0;background:rgba(8,18,38,.38);display:none;align-items:flex-end;z-index:50;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}.modal.show{display:flex}.sheet{width:100%;max-height:88dvh;overflow:auto;background:rgba(248,250,255,.90);border:1px solid rgba(255,255,255,.75);border-radius:26px 26px 0 0;padding:18px;box-shadow:0 -18px 45px rgba(16,33,63,.2);backdrop-filter:blur(26px) saturate(140%);-webkit-backdrop-filter:blur(26px) saturate(140%)}.sheet h2{margin:0 0 12px}.sheet button{width:100%;border:1px solid rgba(255,255,255,.7);border-radius:14px;padding:12px;margin-top:8px;background:rgba(238,242,247,.72);text-align:left;font-weight:750}.sheet .danger{background:rgba(254,226,226,.78);color:#991b1b}.sheet .primary{background:rgba(15,42,99,.92);color:#fff;text-align:center}
.field label{display:block;font-size:11px;font-weight:800;color:#64748b;margin-bottom:5px}.field input{width:100%;padding:11px;border:1px solid rgba(255,255,255,.75);background:rgba(255,255,255,.68);border-radius:13px;outline:0}.statGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{border:1px solid rgba(255,255,255,.7);border-radius:16px;padding:13px;text-align:left;background:rgba(241,245,249,.68);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}.stat b{display:block;font-size:22px}.stat span{font-size:11px;font-weight:750;color:#475569}
.lock{position:fixed;inset:0;background:linear-gradient(160deg,#0b255b,#07162f);z-index:100;color:#fff;display:flex;align-items:center;justify-content:center;padding:25px}.lockbox{width:min(380px,100%);text-align:center}.biglogo{font-size:58px}.lockbox h1{margin:5px 0}.lockbox p{color:#cbd5e1;font-size:13px}.pin{width:100%;padding:14px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.10);color:#fff;border-radius:15px;text-align:center;font-size:21px;letter-spacing:5px;outline:0;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}.unlock{width:100%;margin-top:9px;border:0;border-radius:15px;padding:13px;background:#fff;color:#172554;font-weight:900}.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:rgba(17,24,39,.88);color:#fff;padding:10px 14px;border-radius:999px;font-size:12px;display:none;z-index:80;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}.toast.show{display:block}
.empty{height:100%;display:grid;place-items:center;text-align:center;color:#64748b;padding:30px}

/* V21 — nötr Apple cam kart + seçili durum rengi kartın TÜM kenarlarında */
.cardbox.status-acildi,.cardbox.status-mesgul,.cardbox.status-cevap,.cardbox.status-kapali,.cardbox.status-kullanim,.cardbox.status-evrak{
  background:rgba(248,250,252,.58)!important;

.cardbox.status-mesgul{border-color:#eab308!important;box-shadow:0 0 0 1px rgba(234,179,8,.20),0 0 22px rgba(234,179,8,.22),var(--shadow),inset 0 1px 0 rgba(255,255,255,.9)!important}

.cardbox.status-kapali{border-color:#3b82f6!important;box-shadow:0 0 0 1px rgba(59,130,246,.20),0 0 22px rgba(59,130,246,.22),var(--shadow),inset 0 1px 0 rgba(255,255,255,.9)!important}

.cardbox.status-evrak{border-color:#8b5cf6!important;box-shadow:0 0 0 1px rgba(139,92,246,.20),0 0 22px rgba(139,92,246,.22),var(--shadow),inset 0 1px 0 rgba(255,255,255,.9)!important}
.cardbox .sys{background:rgba(255,255,255,.52)!important;color:#40506b!important;border-color:rgba(255,255,255,.78)!important}
.cardbox .phone{background:rgba(255,255,255,.48)!important;color:#10213f!important;border-color:rgba(255,255,255,.78)!important}

.cardbox .s4.active{background:rgba(191,219,254,.90)!important;color:#1e40af!important}
.cardbox .s5.active{background:rgba(209,213,219,.90)!important;color:#374151!important}

<body>
<div id="lock" class="lock"><div class="lockbox"><div class="biglogo">📱</div><h1>REHBERİM</h1><p id="lockText">Uygulamaya erişmek için şifrenizi girin.</p><input id="pin" class="pin" type="password" inputmode="numeric" maxlength="12" placeholder="••••••"><button id="unlock" class="unlock">GİRİŞ</button></div></div>
<div class="app">
<header><div class="brand"><div class="logo">👥</div><div><b>REHBERİM</b><small>Arama ve Takip Uygulaması</small></div><div class="headBtns"><button class="searchBtn" id="searchBtn" aria-label="Ara" title="Ara">⌕</button><button onclick="openImport()">📥<br>Liste</button><button onclick="openStats()">📊<br>İstatistik</button><button onclick="openSettings()">⚙️<br>Ayarlar</button></div></div><div class="searchWrap"><input id="search" class="search" placeholder="İsim, telefon veya sistem no ile ara..." autocomplete="off"><button class="searchClose" id="searchClose" aria-label="Aramayı kapat">×</button></div></header>
<main class="main"><div id="slider" class="slider"></div></main>
<footer><div class="nav"><button onclick="prev()">◀ Önceki</button><div id="counter" class="count">0 / 0</div><button onclick="next()">Sonraki ▶</button></div></footer></div>
<div id="modal" class="modal"><div id="sheet" class="sheet"></div></div>
<input id="file" type="file" accept=".json,application/json" hidden><div id="toast" class="toast"></div>

<script>
const DBKEY="rehberim_secure_v1", METAKEY="rehberim_meta_v1";
let people=[],filtered=[],current=0,sessionKey=null,lastActivity=Date.now(),lockMinutes=5;
const STATUS=[["acildi","Telefonu açtı","s1"],["mesgul","Meşgul","s2"],["cevap","Cevap vermiyor","s3"],["kapali","Telefon kapalı","s4"],["kullanim","Telefon kullanılmıyor","s5"],["evrak","Evrak ekibe verildi","s6"]];
const SAMPLE=[
{sistemNo:"385653",adSoyad:"Ahmet Yılmaz",telefon:"0555 111 22 33",bendler:"Tedbir kararı, uzaklaştırma kararı mevcut.",kararSuresi:"6 Ay",kararBitisTarihi:"15.12.2026"},
{sistemNo:"385654",adSoyad:"Mehmet Kaya",telefon:"0532 222 33 44",bendler:"Tedbir kararı mevcut.",kararSuresi:"3 Ay",kararBitisTarihi:"20.11.2026"},
{sistemNo:"385655",adSoyad:"Ayşe Demir",telefon:"0544 333 44 55",bendler:"Tedbir kararı.",kararSuresi:"6 Ay",kararBitisTarihi:"05.01.2027"}];
function b64(buf){let s="";for(const x of new Uint8Array(buf))s+=String.fromCharCode(x);return btoa(s)}
function ub64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function derive(pin,salt){const b=await crypto.subtle.importKey("raw",new TextEncoder().encode(pin),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt:ub64(salt),iterations:150000,hash:"SHA-256"},b,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function enc(o,k){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},k,new TextEncoder().encode(JSON.stringify(o)));return{iv:b64(iv),ct:b64(ct)}}
async function dec(p,k){const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub64(p.iv)},k,ub64(p.ct));return JSON.parse(new TextDecoder().decode(pt))}
async function hash(p){return b64(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(p)))}
function meta(){try{return JSON.parse(localStorage.getItem(METAKEY)||"null")}catch{return null}}

function formatDateTime(d=new Date()){
 const pad=n=>String(n).padStart(2,"0");
 return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function toast(s){const t=document.getElementById("toast");t.textContent=s;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)}
function touch(){lastActivity=Date.now()}["click","touchstart","keydown","input"].forEach(e=>document.addEventListener(e,touch,{passive:true}));
async function savePeople(){if(sessionKey)localStorage.setItem(DBKEY,JSON.stringify(await enc(people,sessionKey)))}
async function unlock(){
 const pin=document.getElementById("pin").value.trim();
 if(pin.length<4){toast("En az 4 haneli şifre girin.");return}
 const lockEl=document.getElementById("lock");
 try{
  // V33: İlk kurulum şifresi doğrudan ve güvenli şekilde doğrulanır.
  const m=meta();
  if(!m){
   if(pin!=="385653"){toast("İlk giriş şifresi: 385653");return}
   const salt=b64(crypto.getRandomValues(new Uint8Array(16)));
   sessionKey=await derive(pin,salt);
   localStorage.setItem(METAKEY,JSON.stringify({salt,hash:await hash(pin),lockMinutes:5}));
   lockMinutes=5;
   people=SAMPLE.map(x=>({...x}));
   await savePeople();
   filtered=[...people];
  }else{
   if(await hash(pin)!==m.hash){toast("Şifre hatalı.");return}
   sessionKey=await derive(pin,m.salt);
   lockMinutes=m.lockMinutes||5;
   const p=localStorage.getItem(DBKEY);
   people=p?await dec(JSON.parse(p),sessionKey):[];
   filtered=[...people];
  }
  lockEl.style.display="none";
  render();
  document.getElementById("pin").value="";
  toast("Giriş başarılı.");
 }catch(e){
  console.error("V33 unlock error:",e);
  toast("Giriş hatası: "+(e&&e.message?e.message:"Bilinmeyen hata"));
 }
}
function lockNow(){sessionKey=null;people=[];filtered=[];current=0;document.getElementById("lock").style.display="flex";document.getElementById("lockText").textContent="Otomatik kilitlendi. Devam etmek için şifrenizi girin.";document.getElementById("pin").value=""}
setInterval(()=>{if(sessionKey&&lockMinutes>0&&Date.now()-lastActivity>lockMinutes*60000)lockNow()},1000);
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function phoneHref(v){return"tel:"+String(v??"").replace(/[^\d+]/g,"")}
function daysLeft(s){if(!s)return null;const a=String(s).split(/[.\-\/]/).map(Number);if(a.length!==3||a.some(isNaN))return null;const d=new Date(a[2],a[1]-1,a[0]);d.setHours(0,0,0,0);const n=new Date();n.setHours(0,0,0,0);return Math.ceil((d-n)/86400000)}
function initials(n){return String(n||"?").split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase()}
function render(){
 const sld=document.getElementById("slider"),main=document.querySelector(".main");
 sld.innerHTML="";
 main.className="main";

 if(!filtered.length){
  main.classList.add("status-bg-none");
  sld.innerHTML='<div class="empty"><div><div style="font-size:38px">📋</div><h2>Liste boş</h2><p>Liste menüsünden haftalık JSON dosyasını yükleyin.</p></div></div>';
  updateCounter();
  return;
 }

 /* V37: Aynı anda yalnızca aktif kişi render edilir.
    Binlerce DOM kartı oluşturulmadığı için liste yükleme ve arama hızlanır. */
 const i=Math.max(0,Math.min(current,filtered.length-1));
 current=i;
 const p=filtered[i];
 const d=daysLeft(p.kararBitisTarihi);
 const st=STATUS.find(x=>x[0]===p.durum);
 const sec=document.createElement("section");
 sec.className="card";

 sec.innerHTML=`<div class="cardbox status-${p.durum||""}" data-watermark="">
  <div class="profile">
   <div class="avatar">${esc(initials(p.adSoyad))}</div>
   <div>
    <div class="name">${esc(p.adSoyad)}</div>
    <div class="sys">Sistem No: ${esc(p.sistemNo)}</div>
   </div>
   <div class="pos">${i+1} / ${filtered.length}</div>
  </div>

  <a class="phone" href="${phoneHref(p.telefon)}">
   <span>📞</span><span class="num">${esc(p.telefon)}</span><span class="go">›</span>
  </a>

  <div class="grid2">
   <div class="info purple"><div class="label">Bendler / Karar</div><div class="value">${esc(p.bendler||"—")}</div></div>
   <div class="info yellow"><div class="label">Kararın Süresi</div><div class="value big">${esc(p.kararSuresi||"—")}</div></div>
   <div class="info blue"><div class="label">Kararın Bitiş Tarihi</div><div class="value big">${esc(p.kararBitisTarihi||"—")}</div></div>
   <div class="info green"><div class="label">Kalan Süre</div><div class="value big">${d===null?"—":d>=0?d+" gün kaldı":Math.abs(d)+" gün geçti"}</div></div>
  </div>

  <div class="statusPanel ${p.durum||"none"}">
   <div class="statusTitle">İşlem Durumu${st?" — "+esc(st[1]):""}</div>
   <div class="statuses">${STATUS.map(x=>`<button class="status ${x[2]} ${p.durum===x[0]?"active":""}" data-s="${x[0]}">${esc(x[1])}</button>`).join("")}</div>
  </div>

  <div class="lastAction">${p.durumTarih?`Son işlem: ${esc(p.durumTarih)}`:"Son işlem: Henüz işlem yapılmadı"}</div>
  <textarea class="note" placeholder="Bu kişi için not...">${esc(p.not||"")}</textarea>
 </div>`;

 sec.querySelectorAll(".status").forEach(b=>b.onclick=async()=>{
   p.durum=b.dataset.s;
   p.durumTarih=formatDateTime();
   await savePeople();
   render();
 });

 sec.querySelector(".note").addEventListener("input",async e=>{
   p.not=e.target.value;
   await savePeople();
 });

 sld.appendChild(sec);
 updateCounter();
 setPageStatus();
}
function updateCounter(){document.getElementById("counter").textContent=filtered.length?`${current+1} / ${filtered.length}`:"0 / 0";setPageStatus()}
function setPageStatus(){const main=document.querySelector(".main");main.className="main";const p=filtered[current];main.classList.add(p?.durum?`status-bg-${p.durum}`:"status-bg-none")}
function goTo(i,s=true){
 if(!filtered.length)return;
 const hedef=Math.max(0,Math.min(i,filtered.length-1));
 if(hedef===current){updateCounter();return;}
 current=hedef;
 render();
}
function next(){goTo(current+1)}
function prev(){goTo(current-1)}

/* Android/iPhone: tek kartlı hızlı yapı için yatay kaydırmayı kendimiz yönetiyoruz. */
const slider=document.getElementById("slider");
let touchStartX=0,touchStartY=0,touchActive=false;
slider.addEventListener("touchstart",e=>{
 const t=e.changedTouches[0];
 touchStartX=t.clientX;
 touchStartY=t.clientY;
 touchActive=true;
},{passive:true});
slider.addEventListener("touchend",e=>{
 if(!touchActive)return;
 touchActive=false;
 const t=e.changedTouches[0];
 const dx=t.clientX-touchStartX;
 const dy=t.clientY-touchStartY;
 if(Math.abs(dx)<55 || Math.abs(dx)<=Math.abs(dy))return;
 if(dx<0) next(); else prev();
},{passive:true});
slider.addEventListener("touchcancel",()=>{touchActive=false},{passive:true});
const searchWrap=document.querySelector(".searchWrap");
const searchInput=document.getElementById("search");
const searchBtn=document.getElementById("searchBtn");
const searchClose=document.getElementById("searchClose");
function openSearch(){searchWrap.classList.add("open");setTimeout(()=>searchInput.focus(),80)}
function closeSearch(){searchWrap.classList.remove("open");searchInput.blur()}
searchBtn.addEventListener("click",openSearch);
searchClose.addEventListener("click",closeSearch);
searchInput.addEventListener("input",e=>{const q=e.target.value.trim().toLocaleLowerCase("tr-TR");filtered=people.filter(p=>[p.adSoyad,p.telefon,p.sistemNo,p.bendler,p.kararSuresi,p.kararBitisTarihi].join(" ").toLocaleLowerCase("tr-TR").includes(q));current=0;render()});
function closeModal(){document.getElementById("modal").classList.remove("show")}
function openImport(){document.getElementById("sheet").innerHTML=`<h2>📥 Haftalık Liste</h2><p>Excel'den oluşturulan JSON dosyasını yükleyin. Liste cihazda şifreli saklanır.</p><button class="primary" onclick="document.getElementById('file').click()">JSON DOSYASI SEÇ</button><button onclick="closeModal()">Vazgeç</button>`;document.getElementById("modal").classList.add("show")}
document.getElementById("file").addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;try{const o=JSON.parse(await f.text()),list=Array.isArray(o)?o:(o.people||o.kisiler||o.veriler);if(!Array.isArray(list))throw Error();people=list.map(p=>({sistemNo:p.sistemNo??p.sistem_no??p.sistem??"",adSoyad:p.adSoyad??p.ad_soyad??p.isim??p.ad??"",telefon:p.telefon??p.phone??"",bendler:p.bendler??"",kararSuresi:p.kararSuresi??p.karar_suresi??p.sure??"",kararBitisTarihi:p.kararBitisTarihi??p.karar_bitis_tarihi??p.tedbirBitisTarihi??p.tedbir_bitis_tarihi??p.bitisTarihi??"",durum:p.durum??"",durumTarih:p.durumTarih??p.sonIslem??"",not:p.not??""}));filtered=[...people];current=0;await savePeople();closeModal();render();toast(`${people.length} kişi yüklendi.`)}catch(err){toast("JSON dosyası okunamadı.")}e.target.value=""});
function openStats(){const c=Object.fromEntries(STATUS.map(x=>[x[0],0]));people.forEach(p=>{if(c[p.durum]!==undefined)c[p.durum]++});const done=Object.values(c).reduce((a,b)=>a+b,0);document.getElementById("sheet").innerHTML=`<h2>📊 İstatistikler</h2><p>Toplam: <b>${people.length}</b> · İşlem yapılan: <b>${done}</b> · Kalan: <b>${Math.max(0,people.length-done)}</b></p><div class="statGrid">${STATUS.map(x=>`<button class="stat" onclick="filterStatus('${x[0]}')"><b>${c[x[0]]}</b><span>${x[1]}</span></button>`).join("")}</div><button onclick="showAll()">Tüm kişileri göster</button><button onclick="closeModal()">Kapat</button>`;document.getElementById("modal").classList.add("show")}
function filterStatus(s){filtered=people.filter(p=>p.durum===s);current=0;closeModal();render();toast(`${filtered.length} kişi listelendi.`)}function showAll(){filtered=[...people];current=0;closeModal();render()}
function openSettings(){const m=meta();document.getElementById("sheet").innerHTML=`<h2>⚙️ Ayarlar</h2><div class="field"><label>Otomatik kilit süresi (dakika)</label><input id="lockField" type="number" min="1" max="120" value="${m?.lockMinutes||5}"></div><button class="primary" onclick="saveLock()">Otomatik kilidi kaydet</button><button onclick="changePin()">🔑 Şifreyi değiştir</button><button class="danger" onclick="clearData()">🗑️ Haftalık veriyi sil</button><button onclick="closeModal()">Kapat</button>`;document.getElementById("modal").classList.add("show")}
function saveLock(){const n=Math.max(1,Math.min(120,Number(document.getElementById("lockField").value)||5)),m=meta();m.lockMinutes=n;localStorage.setItem(METAKEY,JSON.stringify(m));lockMinutes=n;closeModal();toast("Otomatik kilit güncellendi.")}
async function changePin(){const old=prompt("Mevcut şifre:");if(old===null)return;const m=meta();if(await hash(old)!==m.hash){alert("Mevcut şifre hatalı.");return}const np=prompt("Yeni şifre (en az 4 hane):");if(!np||np.length<4){alert("Geçersiz şifre.");return}const data=people.slice(),salt=b64(crypto.getRandomValues(new Uint8Array(16))),nk=await derive(np,salt);localStorage.setItem(METAKEY,JSON.stringify({salt,hash:await hash(np),lockMinutes:m.lockMinutes}));sessionKey=nk;await savePeople();closeModal();toast("Şifre değiştirildi.")}
function clearData(){if(!confirm("Bu telefondaki haftalık liste, notlar ve işlem durumları silinsin mi?"))return;localStorage.removeItem(DBKEY);people=[];filtered=[];current=0;closeModal();render();toast("Haftalık veri silindi.")}

// V34: Eski service worker'ın V31/V32 ekranını geri getirmesini engelle.
(function(){
  if(!("serviceWorker" in navigator)) return;
  window.addEventListener("load", async ()=>{
    try{
      const regs = await navigator.serviceWorker.getRegistrations();
      for(const reg of regs) await reg.unregister();
      if("caches" in window){
        const keys = await caches.keys();
        await Promise.all(keys.map(k=>caches.delete(k)));
      }
    }catch(e){}
  });
})();
